# QMT OHLCV research baseline; prices/volumes retain the frozen input basis.
qlib_init:
  kernels: 1
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      num_boost_round: 100
      early_stopping_rounds: 10
      learning_rate: 0.05
      num_leaves: 15
      max_depth: 4
      min_data_in_leaf: 10
      num_threads: 1
      seed: 42
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: QMTNativeOHLCV
        module_path: quant_workflow.qmt_native_provider
        kwargs:
          instruments: all
          start_time: '2021-01-01'
          end_time: '2024-12-31'
          fit_start_time: '2021-01-01'
          fit_end_time: '2022-12-31'
          label:
            - ['Ref($close, -2)/Ref($close, -1) - 1']
            - [LABEL0]
          infer_processors:
            - class: RobustZScoreNorm
              kwargs:
                fields_group: feature
                clip_outlier: true
            - class: Fillna
              kwargs:
                fields_group: feature
          learn_processors:
            - class: DropnaLabel
            - class: CSZScoreNorm
              kwargs:
                fields_group: label
      segments:
        train: ['2021-01-01', '2022-12-31']
        valid: ['2023-01-01', '2023-12-31']
        test: ['2024-01-01', '2024-12-31']
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
